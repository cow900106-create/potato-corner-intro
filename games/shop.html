<!DOCTYPE html>
<html lang="zh-Hant-TW" class="shoppage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#148c44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>薯條小店長｜薯條小遊戲（非官方）</title>
<meta name="description" content="經營一間 Potato Corner 小店：下鍋、調味、做飲料，在客人離開前把餐點送對。請橫放手機遊玩。非官方小遊戲。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="games.css?v=16">
</head>
<body class="play shoppage">
<div class="stagewrap" id="wrap">
<div class="shop-stage" id="stage" aria-label="薯條小店長遊戲畫面">
  <div class="shop-tophud" id="hud">
    <a class="shopback" href="index.html">選單</a>
    <div class="hud-center">
      <div class="hud-coin">金幣 <b id="money">$0</b></div>
      <div class="hud-lives" aria-label="走掉 0/3">
        <span class="lives-lab">走掉 <b id="lost">0</b>/3</span>
        <span class="hearts" id="hearts"><i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i></span>
      </div>
    </div>
    <button class="hud-pause" id="pauseBtn" type="button" hidden>暫停</button>
  </div>
  <button class="hud-mute" id="muteBtn" type="button" aria-pressed="false" aria-label="音效" title="音效">聲音</button>
  <div class="plaza" aria-hidden="true"></div>
  <div class="custs" id="custs"></div>
  <div class="counter" id="counter">
    <div class="counter-deck">
      <div class="col col-3" id="drinks"></div>
      <div class="col col-3" id="raws"></div>
      <div class="col col-jars" id="flavs"></div>
      <div class="col col-3" id="plates"></div>
      <div class="col col-3" id="serves"></div>
      <div class="col col-3 col-fryers" id="fryers"></div>
      <button class="trash-eq" id="trashBtn" type="button" title="丟掉">
        <img class="art" src="img/shop/trash.webp" alt="" draggable="false">
      </button>
    </div>
  </div>
</div>
<div class="overlay shopstart" id="ov">
<img class="ovlogo" id="ovlogo" src="img/logo.png" alt="Potato Corner">
<p class="ovt" id="ovT">薯條小店長</p>
<p class="ovs" id="ovS">不限時間，一直營業。客人耐心用完走掉算 1 次，滿 3 次就結束。請橫放手機遊玩。</p>
<div class="how" id="how">
<div><span>1</span> 點薯條、捲捲薯或雞米花下油鍋，炸籃裡的炸物半浮在金黃油裡冒泡</div>
<div><span>2</span> 炸好點到待調味紙杯，再撒調味粉</div>
<div><span>3</span> 三台飲料機分別是可樂、雪碧、紅茶；點對應機台，杯子會出現在出口。點完成品會自動送給點同一種飲料的客人，送錯種類不算</div>
<div><span>！</span> 組合餐要全部送對才算完成。有 3 桌客人走掉就結束。直向請橫放手機</div>
</div>
<button class="btn" id="go" type="button">開始營業</button>
<p class="fine" id="fine">最高分只存在你的手機瀏覽器。這是非官方小遊戲，沒有兌換或獎品。</p>
</div>
</div>
<script src="games.js?v=2"></script>
<script src="shop.js?v=12"></script>
</body>
</html>
