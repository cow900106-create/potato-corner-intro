<!DOCTYPE html>
<html lang="zh-Hant-TW" class="tdpage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#148c44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>薯條塔防｜薯條小遊戲（非官方）</title>
<meta name="description" content="蓋起司砲台、香辣噴射器和洋蔥減速塔，守住你的薯條小攤。單手就能玩。非官方小遊戲。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="games.css?v=32">
</head>
<body class="play tdpage">
<div class="stagewrap" id="wrap">
<canvas id="stage" aria-label="薯條塔防遊戲畫面"></canvas>
<a class="runback" href="index.html">選單</a>
<button class="hud-mute" id="muteBtn" type="button" aria-pressed="false" aria-label="音效" title="音效">聲音</button>
<button class="td-spd tdbtn" id="spdBtn" type="button" hidden aria-pressed="false">1x</button>
<div class="runhud tdhud" id="hud" hidden>
<span>第 <b id="waveN">1</b> 波</span>
<span>金幣 <b id="gold">300</b></span>
<span>愛心 <b id="lives">10</b></span>
</div>
<button class="td-next tdbtn" id="nextBtn" type="button" hidden>下一波</button>
<div class="tdpan" id="buildPan" hidden></div>
<div class="tdpan tdpan-tow" id="towPan" hidden></div>
<div class="overlay tdstart" id="ov">
<img class="ovlogo" id="ovlogo" src="img/logo.png" alt="Potato Corner">
<img class="ovcover" id="ovcover" src="img/td/cover.webp" alt="薯條塔防">
<p class="ovt" id="ovT">薯條塔防</p>
<p class="ovs" id="ovS">蓋三座風味砲台，守住薯條小攤。</p>
<p class="td-best" id="bestLine"></p>
<div class="how" id="how">
<div><span>①</span> 點空底座選一座砲台蓋下去</div>
<div><span>②</span> 點已蓋的塔可以升級或拆除退費</div>
<div><span>③</span> 提前開下一波可多拿金幣，每 5 波會出現大薯王</div>
</div>
<div class="endbtns" id="endbtns">
<button class="btn" id="go" type="button">開始守衛</button>
<a class="btn quiet" id="toLobby" href="index.html" hidden>回大廳</a>
</div>
<div id="recSlot"></div>
<p class="fine" id="fine">最高分只存在你的手機瀏覽器。這是非官方小遊戲，沒有兌換或獎品。</p>
</div>
</div>
<script src="games.js?v=6"></script>
<script src="td.js?v=5"></script>
</body>
</html>
