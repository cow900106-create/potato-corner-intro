<!DOCTYPE html>
<html lang="zh-Hant-TW" class="pinpage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#148c44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>薯條彈珠台｜薯條小遊戲（非官方）</title>
<meta name="description" content="拉發射器把黃金小土豆彈進場內，撞擊緩衝菇、捲捲薯斜面和調味粉加倍門，用黃金薯條擋板把球打回去。單手或雙拇指都能玩。非官方小遊戲。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="games.css?v=33">
</head>
<body class="play pinpage">
<div class="stagewrap" id="wrap">
<canvas id="stage" aria-label="薯條彈珠台遊戲畫面"></canvas>
<a class="runback" href="index.html">選單</a>
<button class="hud-mute" id="muteBtn" type="button" aria-pressed="false" aria-label="音效" title="音效">聲音</button>
<div class="runhud pinhud" id="hud" hidden>
<span>分數 <b id="score">0</b></span>
<span>最高 <b id="best">0</b></span>
<span>倍率 <b id="mult">1x</b></span>
<span class="pin-lives" id="lives" aria-label="剩餘球數"></span>
</div>
<div class="pinpads" id="pads" hidden>
<button class="pbtn pbtn-l" id="btnL" type="button" aria-label="左擋板">◀</button>
<button class="pbtn pbtn-shoot" id="btnShoot" type="button" aria-label="發射">發射</button>
<button class="pbtn pbtn-r" id="btnR" type="button" aria-label="右擋板">▶</button>
</div>
<div class="overlay pinstart" id="ov">
<img class="ovlogo" id="ovlogo" src="img/logo.png" alt="Potato Corner">
<img class="ovcover" id="ovcover" src="img/pinball/cover.webp" alt="薯條彈珠台">
<p class="ovt" id="ovT">薯條彈珠台</p>
<p class="ovs" id="ovS">長按發射把小土豆彈進場內，左右擋板把球打回去，撞緩衝菇和加倍門刷高分。</p>
<p class="pin-best" id="bestLine"></p>
<div class="how" id="how">
<div><span>↑</span> 長按右下發射鍵蓄力，放開就發射</div>
<div><span>◀▶</span> 按住左半／右半或左右鍵抬起擋板</div>
<div><span>★</span> 三個調味粉門全亮就升級倍率，3 顆球漏完結束</div>
</div>
<div class="endbtns" id="endbtns">
<button class="btn" id="go" type="button">開始玩</button>
<a class="btn quiet" id="toLobby" href="index.html" hidden>回大廳</a>
</div>
<div id="recSlot"></div>
<p class="fine" id="fine">最高分只存在你的手機瀏覽器。這是非官方小遊戲，沒有兌換或獎品。</p>
</div>
</div>
<script src="games.js?v=7"></script>
<script src="pinball.js?v=4"></script>
</body>
</html>
