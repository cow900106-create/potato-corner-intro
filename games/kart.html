<!DOCTYPE html>
<html lang="zh-Hant-TW" class="kartpage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#148c44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>土豆卡丁車｜薯條小遊戲（非官方）</title>
<meta name="description" content="3 圈競速小遊戲。車子會自己加速，左右轉向、吃道具、踩加速帶，搶先衝線。非官方小遊戲。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="games.css?v=26">
</head>
<body class="play kartpage">
<div class="stagewrap" id="wrap">
<canvas id="stage" aria-label="土豆卡丁車遊戲畫面"></canvas>
<a class="kartback" href="index.html">選單</a>
<button class="kart-mute" id="muteBtn" type="button" aria-pressed="false" aria-label="音效" title="音效">聲音</button>
<div class="karthud" id="hud" hidden>
  <div class="kh-hearts" id="kartHearts" aria-label="剩餘生命 3">
    <i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i><i class="heart" aria-hidden="true"></i>
  </div>
  <div class="kh-top">
    <div class="kh-rank" id="rank">4th</div>
    <div class="kh-meta">
      <span>圈 <b id="lap">1</b>/3</span>
      <span><b id="spd">0</b> km/h</span>
    </div>
  </div>
  <div class="kh-prog" id="prog" aria-label="賽程進度">
    <span class="kh-track"></span>
    <i class="kp kp-bbq" id="dot-bbq"></i>
    <i class="kp kp-chili" id="dot-chili"></i>
    <i class="kp kp-cheese" id="dot-cheese"></i>
    <i class="kp kp-you" id="dot-you"></i>
  </div>
</div>
<div class="kart-controls" id="controls" hidden>
  <div class="kart-pad" id="pad">
    <button class="kbtn kbtn-l" id="btnL" type="button" aria-label="左轉">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M41 12 L20 32 L41 52" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="kbtn kbtn-r" id="btnR" type="button" aria-label="右轉">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M23 12 L44 32 L23 52" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <button class="kart-item" id="itemBtn" type="button" aria-label="使用道具">
    <img class="item-art" id="itemIcon" alt="">
    <svg class="item-idle" id="itemIdle" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
      <path d="M24 25c0-5.2 3.8-9 8.4-9 4.4 0 8 3 8 7.2 0 3.4-1.8 5.2-5.2 7.6l-1.4 1.1v4.6" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="47" r="2.6" fill="currentColor"/>
    </svg>
  </button>
</div>
<div class="overlay kartstart" id="ov">
<div class="kart-hero">
<p class="ovt" id="ovT">土豆卡丁車</p>
<p class="ovs" id="ovS">3 圈競速，先衝線就贏。車子會自己加速，有 3 條命。</p>
</div>
<div class="kart-card">
<div class="how" id="how">
<div><span>↔</span> 按住左下角 ◀ ▶ 讓車子左右移動，電腦用方向鍵或 A D。放開就停在那個位置</div>
<div><span>⇢</span> 踩上綠色加速帶會衝刺，路旁問號箱可以拿到道具</div>
<div><span>★</span> 右下角道具鍵或空白鍵放道具：香辣渦輪、起司護盾、薯條油漬、追蹤辣椒彈</div>
<div><span>♥</span> 有 3 條命。撞到路障或被對手道具打中會扣 1 命，有起司護盾可擋一次</div>
</div>
<p class="kart-best" id="bestLine"></p>
<button class="btn" id="go" type="button">開始比賽</button>
<p class="fine" id="fine">這是非官方小遊戲，沒有兌換或獎品。</p>
</div>
</div>
<div class="kart-hurt" id="hurtTip" hidden>−1 命</div>
</div>
<script src="games.js?v=3"></script>
<script src="kart.js?v=8"></script>
</body>
</html>
