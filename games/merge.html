<!DOCTYPE html>
<html lang="zh-Hant-TW" class="mergepage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#148c44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>合成大土豆｜薯條小遊戲（非官方）</title>
<meta name="description" content="左右滑動把一樣的薯球合成更大顆，一路合到巨無霸黃金大土豆。單手就能玩。非官方小遊戲。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="games.css?v=31">
</head>
<body class="play mergepage">
<div class="stagewrap" id="wrap">
<canvas id="stage" aria-label="合成大土豆遊戲畫面"></canvas>
<a class="runback" href="index.html">選單</a>
<button class="hud-mute" id="muteBtn" type="button" aria-pressed="false" aria-label="音效" title="音效">聲音</button>
<div class="runhud mergehud" id="hud" hidden>
<span>分數 <b id="score">0</b></span>
<span>最高 <b id="best">0</b></span>
</div>
<div class="merge-next" id="nextWrap" hidden>
<span>下一個</span>
<img id="nextIm" alt="下一顆" width="48" height="48">
</div>
<div class="merge-chain" id="chain" hidden></div>
<div class="overlay mergestart" id="ov">
<img class="ovlogo" id="ovlogo" src="img/logo.png" alt="Potato Corner">
<img class="ovcover" id="ovcover" src="img/merge/cover.webp" alt="合成大土豆">
<p class="ovt" id="ovT">合成大土豆</p>
<p class="ovs" id="ovS">左右滑動瞄準，放開就掉下去。兩顆一樣的會合成更大的土豆。</p>
<p class="merge-best" id="bestLine"></p>
<div class="how" id="how">
<div><span>← →</span> 按住左右滑動瞄準，放開即掉落</div>
<div><span>+</span> 兩顆相同的碰在一起，合成下一階</div>
<div><span>！</span> 薯球在警戒線上停留太久就結束</div>
</div>
<div class="endbtns" id="endbtns">
<button class="btn" id="go" type="button">開始玩</button>
<a class="btn quiet" id="toLobby" href="index.html" hidden>回大廳</a>
</div>
<div id="recSlot"></div>
<p class="fine" id="fine">最高分只存在你的手機瀏覽器。這是非官方小遊戲，沒有兌換或獎品。</p>
</div>
</div>
<script src="games.js?v=5"></script>
<script src="merge.js?v=1"></script>
</body>
</html>
